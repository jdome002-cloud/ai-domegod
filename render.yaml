# AI DOMEgod — Render Blueprint (free web service)
# After the first deploy, set GROQ_API_KEY in the Render dashboard
# (get a free key at https://console.groq.com). Do not put keys in this file.

services:
  - type: web
    name: ai-domegod
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Optional OpenAI fallback (used only if GROQ_API_KEY is unset and AI_PROVIDER=openai)
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
