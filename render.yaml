# AI DOMEgod — Render Blueprint (free web service)
# After the first deploy, set OPENAI_API_KEY in the Render dashboard.
# Do not put the key in this file.

services:
  - type: web
    name: ai-domegod
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
